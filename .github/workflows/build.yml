# Builda os instaladores (Windows + macOS) quando uma tag v* é publicada
# e anexa tudo numa Release do GitHub — que também alimenta o auto-update.
name: build

on:
  push:
    tags: ['v*']

# O token padrão precisa de escrita para criar a Release com os instaladores
permissions:
  contents: write

# Builds em sequência (Windows cria a Release; o Mac anexa nela) para
# evitar a corrida que gerava dois rascunhos duplicados.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build e publicar instalador Windows
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build e publicar instalador macOS (universal)
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
