# Builda os instaladores (Windows + macOS) quando uma tag v* é publicada
# e anexa tudo numa Release do GitHub — que também alimenta o auto-update.
name: build

on:
  push:
    tags: ['v*']

# O token padrão precisa de escrita para criar a Release com os instaladores
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build e publicar instalador
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
