# Builda os instaladores (Windows + macOS) quando uma tag v* é publicada
# e anexa tudo numa Release do GitHub — que também alimenta o auto-update.
name: build

on:
  push:
    tags: ['v*']

# O token padrão precisa de escrita para criar a Release com os instaladores
permissions:
  contents: write

# Builds em sequência (Windows cria a Release; o Mac anexa nela) para
# evitar a corrida que gerava dois rascunhos duplicados.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build e publicar instalador Windows
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build e publicar instalador macOS (universal)
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Os dois builds anexam num RASCUNHO (podem compartilhar); este passo
  # final publica o rascunho — evita a corrida que duplicava a release.
  publish-release:
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Publicar o rascunho da release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rid=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r '[.[] | select(.tag_name=="${{ github.ref_name }}" and .draft==true)][0].id')
          if [ "$rid" != "null" ] && [ -n "$rid" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
              -d '{"draft":false}' \
              "https://api.github.com/repos/${{ github.repository }}/releases/$rid" > /dev/null
            echo "release $rid publicada"
          else
            echo "nenhum rascunho para publicar"
          fi
