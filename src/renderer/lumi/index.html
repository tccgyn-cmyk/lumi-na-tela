<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Lumi</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="lumi.css" />
</head>
<body>
  <div id="bubble" class="bubble hidden">
    <p id="bubble-text"></p>
    <div id="bubble-actions" class="bubble-actions hidden">
      <button id="btn-accept">Bora! 💪</button>
      <button id="btn-snooze">Daqui a 10 min</button>
      <button id="btn-dismiss">Agora não</button>
    </div>
  </div>
  <div id="lumi" data-state="idle">
    <svg viewBox="0 0 200 180" width="144" height="130" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="aura" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#ffc93c" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#ffc93c" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff3b8" />
          <stop offset="70%" stop-color="#ffdf6b" />
          <stop offset="100%" stop-color="#ffc93c" />
        </linearGradient>
      </defs>
      <g class="body-group">
        <circle class="aura" cx="100" cy="85" r="85" fill="url(#aura)" />
        <g class="sparkles" fill="#ffb320">
          <circle cx="66" cy="34" r="3.5" />
          <circle cx="136" cy="26" r="2.8" />
          <circle cx="118" cy="12" r="2.4" />
        </g>
        <path class="corpo" d="M100 14 C104 26 118 34 126 52 C134 70 138 96 132 118 C126 142 114 156 100 156 C86 156 74 142 68 118 C62 96 66 70 74 52 C82 34 96 26 100 14 Z" fill="url(#corpo)" stroke="#e09f2f" stroke-width="3" />
        <path class="flame" d="M100 20 C103 28 110 33 112 42 C114 52 108 58 100 58 C92 58 86 52 88 42 C90 33 97 28 100 20 Z" fill="#fff8dc" opacity="0.95" />
        <ellipse cx="88" cy="158" rx="9" ry="6" fill="#ffd23e" stroke="#e09f2f" stroke-width="2" />
        <ellipse cx="112" cy="158" rx="9" ry="6" fill="#ffd23e" stroke="#e09f2f" stroke-width="2" />
        <path class="jaleco" d="M66 112 Q100 102 134 112 L138 144 Q100 156 62 144 Z" fill="#7cc7ba" stroke="#4fae9f" stroke-width="2.5" />
        <path d="M100 108 L84 122 M100 108 L116 122" stroke="#5db6a8" stroke-width="3" fill="none" stroke-linecap="round" />
        <rect x="116" y="124" width="12" height="12" rx="3" fill="#ffffff" opacity="0.9" />
        <path d="M122 128 c-1.5 -2 -4.5 -1 -4.5 1 c0 2 4.5 4 4.5 4 c0 0 4.5 -2 4.5 -4 c0 -2 -3 -3 -4.5 -1 Z" fill="#2fa89a" />
        <ellipse cx="76" cy="124" rx="10" ry="14" fill="#ffd23e" stroke="#e09f2f" stroke-width="2" transform="rotate(20 76 124)" />
        <ellipse cx="124" cy="124" rx="10" ry="14" fill="#ffd23e" stroke="#e09f2f" stroke-width="2" transform="rotate(-20 124 124)" />
        <circle cx="100" cy="130" r="9" fill="#8ee8db" opacity="0.45" />
        <path class="coracao" d="M100 126 c-3 -5 -10 -3 -10 2 c0 5 10 9 10 9 c0 0 10 -4 10 -9 c0 -5 -7 -7 -10 -2 Z" fill="#2fbfae" />
        <g class="eyes">
          <circle cx="87" cy="74" r="7.5" fill="#2b3247" />
          <circle cx="113" cy="74" r="7.5" fill="#2b3247" />
          <circle cx="90" cy="71" r="2.6" fill="#ffffff" />
          <circle cx="116" cy="71" r="2.6" fill="#ffffff" />
          <circle cx="85" cy="77" r="1.2" fill="#ffffff" opacity="0.8" />
          <circle cx="111" cy="77" r="1.2" fill="#ffffff" opacity="0.8" />
        </g>
        <path d="M80 62 Q84 59 88 61" stroke="#c08a28" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M112 61 Q116 59 120 62" stroke="#c08a28" stroke-width="2" fill="none" stroke-linecap="round" />
        <path class="mouth" d="M94 88 Q100 93 106 88" stroke="#9a6120" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <circle cx="76" cy="84" r="4.5" fill="#ff9d6e" opacity="0.8" />
        <circle cx="124" cy="84" r="4.5" fill="#ff9d6e" opacity="0.8" />
      </g>
    </svg>
  </div>
  <script src="lumi.js"></script>
</body>
</html>
