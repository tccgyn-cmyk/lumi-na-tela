<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Lumi</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
  <link rel="stylesheet" href="lumi.css" />
</head>
<body>
  <div id="bubble" class="bubble hidden">
    <p id="bubble-text"></p>
    <div id="bubble-actions" class="bubble-actions hidden">
      <button id="btn-accept">Bora! 💪</button>
      <button id="btn-snooze">Daqui a 10 min</button>
      <button id="btn-dismiss">Agora não</button>
    </div>
    <div id="onboard" class="hidden">
      <input id="onboard-input" maxlength="30" placeholder="Digite aqui..." />
      <div id="onboard-buttons" class="onboard-buttons"></div>
    </div>
  </div>
  <div id="lumi" data-state="idle">
    <img id="lumi-sprite" src="img/idle.png" alt="" draggable="false" />
  </div>
  <script src="lumi.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
